<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" fill="none">
  <defs>
    <linearGradient id="humingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Hexagonal / Architectural Manufacturing Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagon -->
    <path d="M40 0 L75 20 L75 60 L40 80 L5 60 L5 20 Z" fill="url(#humingGrad)" filter="url(#shadow)" />
    
    <!-- Stylized 'H' Pillars -->
    <path d="M22 24 L32 24 L32 56 L22 56 Z" fill="#FFFFFF" />
    <path d="M48 24 L58 24 L58 56 L48 56 Z" fill="#FFFFFF" />
    <path d="M32 36 L48 36 L48 44 L32 44 Z" fill="url(#goldAccent)" />
    
    <!-- Industrial Cornerstone Dot -->
    <circle cx="40" cy="18" r="3.5" fill="#38BDF8" />
    <circle cx="40" cy="62" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 20)">
    <!-- HUMING -->
    <text x="0" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="2" fill="#0F172A">
      HUMING
    </text>
    
    <!-- Accent Line -->
    <rect x="135" y="16" width="3" height="18" fill="#F59E0B" rx="1.5" />

    <!-- INTERNATIONAL LIMITED -->
    <text x="145" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5" fill="#0284C7">
      INTERNATIONAL
    </text>

    <!-- Subtitle / Positioning -->
    <text x="0" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.5" fill="#64748B">
      MANUFACTURING &amp; SUPPLY CO. LIMITED
    </text>
  </g>
</svg>
